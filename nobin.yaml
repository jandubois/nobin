# Sample nobin configuration file.
# Copy to .nobin.yaml in your project root to customize.
#
# Command-line flags override these values. List flags
# (--skip, --skip-base64, --skip-ext, --allow) extend the lists below.

# Scanning scope
all: false
gitignore: false
skip: []
skip-ext: []

# Allowed characters
allow: []
allow-bell: false
allow-bom: false
allow-emoji: false
allow-escape: false

# Additional checks (0 = disabled, positive value = minimum length)
block-base64: 0
skip-base64: []

# Output
quiet: false
verbose: false
hide-skipped: false
