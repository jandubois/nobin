# Sample nobin configuration file.
# Copy to .nobin.yaml in your project root to customize.
#
# Command-line flags override these values. List flags
# (--skip, --skip-base64, --skip-confusables, --skip-ext, --allow)
# extend the lists below.

# Scanning scope
all: false
gitignore: false
skip: []
skip-ext: []

# Allowed characters
allow: []
allow-bell: false
allow-bom: false
allow-emoji: false
allow-escape: false

# Additional checks (opt-in)
block-base64: 0          # 0 = disabled, N = minimum run length
skip-base64: []
block-confusables: ""    # "" = disabled, "alphanum" / "url" / "strict"
skip-confusables: []

# Output
quiet: false
verbose: false       # false = off, true = first 20, or set N directly
hide-skipped: false
